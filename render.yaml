databases:
  - name: oikos-db
    plan: free
    databaseName: oikos
    user: oikos

services:
  - type: web
    name: oikos
    runtime: node
    plan: free
    # NODE_ENV=production makes npm skip devDependencies. The client build
    # tool (vite) lives in devDependencies, so the client install MUST pass
    # --include=dev or `vite build` fails with "command not found" (exit 127).
    buildCommand: npm ci --include=dev && npm ci --prefix client --include=dev && npm ci --prefix apps/server && npm run build --prefix client
    startCommand: node apps/server/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.12.0"
      # Disable DEV_OTP in production. Toggle to "true" only for demos.
      - key: DEV_OTP_VISIBLE
        value: "false"
      - key: SESSION_EXPIRY_DAYS
        value: "30"
      # Postgres connection injected by the oikos-db service above
      - key: DATABASE_URL
        fromDatabase:
          name: oikos-db
          property: connectionString
      # Allowed Origin list — web + Android WebView both need to be reachable.
      # capacitor://localhost is what the packaged Android app reports as origin.
      - key: CORS_ORIGINS
        value: "https://oikos.onrender.com,capacitor://localhost,https://localhost,http://localhost"
      # ---------- AI keys ----------
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # ---------- SMS / OTP delivery (MSG91) ----------
      # MSG91_AUTH_KEY   → MSG91 dashboard → Auth Key
      # MSG91_TEMPLATE_ID → the DLT-approved Flow template id used to send the OTP
      # MSG91_OTP_VAR    → the variable name inside that template (default "OTP")
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_TEMPLATE_ID
        sync: false
      - key: MSG91_OTP_VAR
        sync: false
      # ---------- Firebase Cloud Messaging ----------
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      - key: FIREBASE_VAPID_KEY
        sync: false
      # Paste the FULL service-account JSON file content (Render supports multi-line)
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      # ---------- Affiliate tags (optional) ----------
      - key: AFFILIATE_TAG_BLINKIT
        sync: false
      - key: AFFILIATE_TAG_ZEPTO
        sync: false
      - key: AFFILIATE_TAG_BIGBASKET
        sync: false
      - key: AFFILIATE_TAG_SWIGGYINSTAMART
        sync: false
      - key: AFFILIATE_TAG_AMAZONFRESH
        sync: false
